name: Publier le theme
on: workflow_dispatch
permissions:
  contents: write
jobs:
  publier:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Recuperer et decompresser le zip
        run: |
          gh release download zip-source -p NXE360_github.zip
          unzip -o -q NXE360_github.zip -d .
          rm NXE360_github.zip
          test -f theme.xml
      - name: Licence et gitignore
        run: |
          [ -f LICENSE ] || curl -fsSL https://creativecommons.org/licenses/by-nc-sa/4.0/legalcode.txt -o LICENSE
          cat > .gitignore <<'EOF'
          # Fabriques par nxe360_recent.sh chez chaque utilisateur
          **/art/recent/
          **/art/stair/
          **/art/spot/
          **/art/gstack/
          # Avatar personnel (360sona) : seul art/avatar/default* est livre
          **/art/avatar/export*
          **/art/avatar/*.glb
          # Sauvegardes, journaux, fichiers systeme
          *.bak
          *.tmp
          *.log
          Thumbs.db
          desktop.ini
          .DS_Store
          EOF
      - name: Publier
        run: |
          git config user.name "blunpai"
          git config user.email "blunpai@users.noreply.github.com"
          git add -A
          git commit -q -m "Theme NXE360"
          git push
          gh release delete zip-source --yes --cleanup-tag
